<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseLens | Evidence-Grounded Legal AI</title>
  <meta name="description" content="CaseLens reviews contracts and case files, drafts legal documents, and researches authorities with every finding linked to its exact source.">
  
  <!-- Modern & Luxury Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/review.css">
  <link rel="stylesheet" href="css/supplied-layout.css">
</head>
<body>

  <!-- APP SHELL -->
  <div class="app-container">
    
    <!-- SIDEBAR - OFFICIAL BURGUNDY (Zero Emojis, Pure Vector SVGs) -->
    <aside class="app-sidebar">
      <div>
        <!-- Brand Logo -->
        <div class="brand-section">
          <div class="brand-logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path d="M7 21h10"/>
              <path d="M12 3v18"/>
              <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
            </svg>
          </div>
          <div class="brand-title-wrap">
            <span class="brand-name" id="app-brand-title">
              CaseLens
            </span>
            <span class="brand-subtitle">Evidence-Grounded Legal AI</span>
          </div>
        </div>

        <!-- Navigation Menu with Official Clean SVGs -->
        <ul class="nav-list">
          <li>
            <button class="nav-item-btn active" data-view="homepage">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              </span>
              <span>Home</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="workflow-4">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
              </span>
              <span>AI Assistant</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="workflow-1">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </span>
              <span>Contract / Case Review</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="workflow-3">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <span>Legal Research</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="workflow-2">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </span>
              <span>Drafting</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="documents">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
              </span>
              <span>Case Law & Documents</span>
              <span class="nav-badge" id="nav-badge-docs-count">6</span>
            </button>
          </li>


        </ul>

        <!-- Bottom Agent Promo Card -->
        <div class="sidebar-agent-card">
          <div class="agent-card-sparkle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div class="agent-card-title">Let the Agent Work for You</div>
          <div class="agent-card-text">
            Automate complex legal tasks with your personal AI agent.
          </div>
          <button class="btn btn-gold btn-sm supplied-37ab52c9d6" id="sidebar-start-agent">
            Start Agent &rarr;
          </button>
        </div>
      </div>

      <div class="sidebar-footer-caption">
        Smarter Legal Work, Faster.
      </div>
    </aside>

    <!-- TOP APP HEADER -->
    <header class="app-header">
      <div class="header-search-wrap">
        <span class="header-search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" class="header-search-input" placeholder="Search laws, cases, statutes, or ask anything..." />
        <span class="header-search-shortcut">⌘ K</span>
      </div>

      <div class="header-right">
        <!-- Tenant isolation status indicator -->
        <div class="tenant-pill" title="Tenant: Apex-Legal-Enterprise (Isolated)">
          <span class="tenant-dot"></span>
          <span>Tenant: Apex-Enterprise</span>
        </div>

        <!-- Notification Bell -->
        <button class="header-icon-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="header-icon-badge"></span>
        </button>

        <!-- User Profile -->
        <div class="user-profile-btn">
          <div class="user-avatar">DS</div>
          <span class="user-name">Daniel Smith</span>
          <span class="user-caret">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="app-main">
      <div id="view-homepage" class="view-panel active"></div>
      <div id="view-documents" class="view-panel"></div>
      <div id="view-workflow-1" class="view-panel"></div>
      <div id="view-workflow-2" class="view-panel"></div>
      <div id="view-workflow-3" class="view-panel"></div>
      <div id="view-workflow-4" class="view-panel"></div>
      <div id="view-novelty" class="view-panel"></div>

    </main>

  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- MAIN APPLICATION CONTROLLER -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
